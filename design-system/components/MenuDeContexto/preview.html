<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Menu de contexto</title>
<style>
  html,body{margin:0;background:var(--t-bg);color:var(--t-fg-1);font:400 16px/24px var(--t-font-sans)}
  .tr-preview{display:grid;gap:var(--sp-400);padding:var(--sp-600);box-sizing:border-box}

<body>
<div class="tr-preview tr-demo" id="root">
<div class="tr-stage">
<div class="tr-stack">
<ul aria-label="Arquivos" class="tr-list">
<li><span class="tr-list__text">relatorio-trimestral.pdf<small>Alterado hoje</small></span></li>
<li><span class="tr-list__text">contrato-fornecedor.docx<small>Selecionado</small></span></li>
</ul>
<div aria-label="Ações de contrato-fornecedor.docx" class="tr-menu" role="menu">
<button role="menuitem" type="button">Abrir</button>
<button role="menuitem" type="button">Abrir em nova aba</button>
<hr role="separator"/>
<button role="menuitem" type="button">Copiar link</button>
<button role="menuitem" type="button">Renomear…</button>
<button role="menuitem" type="button">Mover para pasta…</button>
<hr role="separator"/>
<button class="tr-danger-item" role="menuitem" type="button">Excluir arquivo…</button>
</div>
</div>
</div>
</div>
</body>
</html>
