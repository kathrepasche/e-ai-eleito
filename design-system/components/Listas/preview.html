<!-- @dsCard group="Layout e organização" height=316 subtitle="Listas" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Listas</title>
<style>
  html,body{margin:0;background:var(--t-bg);color:var(--t-fg-1);font:400 16px/24px var(--t-font-sans)}
  .tr-preview{display:grid;gap:var(--sp-400);padding:var(--sp-600);box-sizing:border-box}
  .tr-preview form{margin:0}
</style></head>
<body>
<div class="tr-preview tr-demo" id="root">
<h3 class="tr-subtitle" id="p-listas-demo-titulo">Dispositivos conectados</h3>
<ul aria-labelledby="p-listas-demo-titulo" class="tr-list">
<li>
<span aria-hidden="true" class="tr-avatar tr-avatar--sm">N</span>
<span class="tr-list__text">Notebook do escritório<small>Último acesso há 5 minutos</small></span>
<button class="tr-btn tr-btn--sm" type="button">Desconectar<span class="tr-visually-hidden"> Notebook do escritório</span></button>
</li>
<li>
<span aria-hidden="true" class="tr-avatar tr-avatar--sm">C</span>
<span class="tr-list__text">Celular pessoal<small>Último acesso ontem</small></span>
<button class="tr-btn tr-btn--sm" type="button">Desconectar<span class="tr-visually-hidden"> Celular pessoal</span></button>
</li>
<li>
<span class="tr-list__text">Avisar sobre novos acessos<small>Enviamos um e-mail a cada novo dispositivo</small></span>
<label class="tr-switch"><input checked="" role="switch" type="checkbox"/><span></span><span class="tr-visually-hidden">Avisar sobre novos acessos</span></label>
</li>
</ul>
</div>
</body>
</html>
