<!-- @dsCard group="Apresentação" height=494 subtitle="Resumo de erros" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Resumo de erros</title>
<style>
  html,body{margin:0;background:var(--t-bg);color:var(--t-fg-1);font:400 16px/24px var(--t-font-sans)}
  .tr-preview{display:grid;gap:var(--sp-400);padding:var(--sp-600);box-sizing:border-box}
  .tr-preview form{margin:0}
</style></head>
<body>
<div class="tr-preview tr-demo" id="root">
<form class="tr-stack" novalidate="" onsubmit="return false">
<div class="tr-error-summary" tabindex="-1">
<div role="alert">
<h3 id="p-resumo-erros-titulo">Há um problema</h3>
<ul>
<li><a href="#p-resumo-erros-cpf">Digite o CPF com 11 números</a></li>
<li><a href="#p-resumo-erros-dia">A data de nascimento deve estar no passado</a></li>
</ul>
</div>
</div>
<div class="tr-field">
<label class="tr-label" for="p-resumo-erros-cpf">CPF</label>
<span class="tr-hint" id="p-resumo-erros-cpf-dica">11 números, com ou sem pontos e hífen. Por exemplo, 123.456.789-09</span>
<span class="tr-error-msg" id="p-resumo-erros-cpf-erro"><span class="tr-visually-hidden">Erro:</span> Digite o CPF com 11 números</span>
<input aria-describedby="p-resumo-erros-cpf-dica p-resumo-erros-cpf-erro" aria-invalid="true" class="tr-input" id="p-resumo-erros-cpf" name="cpf" value="123.456.78"/>
</div>
<fieldset aria-describedby="p-resumo-erros-data-erro" class="tr-fieldset">
<legend>Data de nascimento</legend>
<span class="tr-error-msg" id="p-resumo-erros-data-erro"><span class="tr-visually-hidden">Erro:</span> A data de nascimento deve estar no passado</span>
<div class="tr-date">
<div class="tr-field"><label class="tr-label" for="p-resumo-erros-dia">Dia</label><input aria-invalid="true" class="tr-input" id="p-resumo-erros-dia" inputmode="numeric" value="12"/></div>
<div class="tr-field"><label class="tr-label" for="p-resumo-erros-mes">Mês</label><input aria-invalid="true" class="tr-input" id="p-resumo-erros-mes" inputmode="numeric" value="3"/></div>
<div class="tr-field"><label class="tr-label" for="p-resumo-erros-ano">Ano</label><input aria-invalid="true" class="tr-input" id="p-resumo-erros-ano" inputmode="numeric" value="2031"/></div>
</div>
</fieldset>
<div><button class="tr-btn tr-btn--primary" type="submit">Continuar</button></div>
</form>
</div>
</body>
</html>
