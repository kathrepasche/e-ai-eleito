<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Avatar</title>
<style>
  html,body{margin:0;background:var(--t-bg);color:var(--t-fg-1);font:400 16px/24px var(--t-font-sans)}
  .tr-preview{display:grid;gap:var(--sp-400);padding:var(--sp-600);box-sizing:border-box}
  .tr-preview form{margin:0}
</style></head>
<body>
<div class="tr-preview tr-demo" id="root">
<div class="tr-stack">
<div class="tr-row">
<span aria-label="Marina Teixeira" class="tr-avatar tr-avatar--sm" role="img">MT</span>
<span aria-label="Marina Teixeira, disponível" class="tr-avatar" role="img">MT<span aria-hidden="true" class="tr-presence"></span></span>
<span aria-label="Marina Teixeira" class="tr-avatar tr-avatar--lg" role="img">MT</span>
<span aria-label="Equipe Financeiro" class="tr-avatar tr-avatar--group" role="img">FI</span>
</div>
<ul class="tr-list">
<li><span aria-hidden="true" class="tr-avatar">CR</span><span class="tr-list__text">Caio Ramos<small>Aprovou o orçamento há 2 horas</small></span></li>
</ul>
<div aria-label="5 participantes: Ana Lopes, Bruno Dias e mais 3" class="tr-row" role="group">
<span aria-hidden="true" class="tr-avatar tr-avatar--sm">AL</span>
<span aria-hidden="true" class="tr-avatar tr-avatar--sm">BD</span>
<span aria-hidden="true" class="tr-avatar tr-avatar--sm">+3</span>
</div>
</div>
</div>
</body>
</html>
