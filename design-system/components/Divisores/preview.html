<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Divisores</title>
<style>
  html,body{margin:0;background:var(--t-bg);color:var(--t-fg-1);font:400 16px/24px var(--t-font-sans)}
  .tr-preview{display:grid;gap:var(--sp-400);padding:var(--sp-600);box-sizing:border-box}
  .tr-preview form{margin:0}
</style></head>
<body>
<div class="tr-preview tr-demo" id="root">
<div class="tr-stack">
<div>
<p class="tr-subtitle">Notificações</p>
<p class="tr-body-sm">Escolha como quer ser avisado sobre pedidos.</p>
</div>
<hr class="tr-divider"/>
<div>
<p class="tr-subtitle">Privacidade</p>
<p class="tr-body-sm">Controle quem vê sua atividade.</p>
</div>
<div aria-label="Formatação" class="tr-toolbar" role="toolbar">
<button class="tr-btn tr-btn--subtle tr-btn--sm" type="button">Negrito</button>
<button class="tr-btn tr-btn--subtle tr-btn--sm" type="button">Itálico</button>
<span aria-orientation="vertical" class="tr-toolbar__sep" role="separator"></span>
<button class="tr-btn tr-btn--subtle tr-btn--sm" type="button">Lista</button>
<button class="tr-btn tr-btn--subtle tr-btn--sm" type="button">Link</button>
</div>
</div>
</div>
</body>
</html>
