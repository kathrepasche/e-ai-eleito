<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Tooltips</title>
<style>
  html,body{margin:0;background:var(--t-bg);color:var(--t-fg-1);font:400 16px/24px var(--t-font-sans)}
  .tr-preview{display:grid;gap:var(--sp-400);padding:var(--sp-600);box-sizing:border-box}
  .tr-preview form{margin:0}
</style></head>
<body>
<div class="tr-preview tr-demo" id="root">
<div class="tr-row">
<div class="tr-stack">
<button aria-labelledby="p-tooltips-demo-1" class="tr-btn tr-btn--icon" type="button">⧉</button>
<span class="tr-tooltip" id="p-tooltips-demo-1" role="tooltip">Duplicar (Ctrl+D)</span>
</div>
<div class="tr-stack">
<button aria-describedby="p-tooltips-demo-2" aria-disabled="true" class="tr-btn" type="button">Publicar</button>
<span class="tr-tooltip" id="p-tooltips-demo-2" role="tooltip">Preencha o título para publicar</span>
</div>
</div>
</div>
</body>
</html>
