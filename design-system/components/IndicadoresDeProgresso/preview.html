<!-- @dsCard group="Status" height=308 subtitle="Indicadores de progresso" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Indicadores de progresso</title>
<style>
  html,body{margin:0;background:var(--t-bg);color:var(--t-fg-1);font:400 16px/24px var(--t-font-sans)}
  .tr-preview{display:grid;gap:var(--sp-400);padding:var(--sp-600);box-sizing:border-box}
  .tr-preview form{margin:0}
</style></head>
<body>
<div class="tr-preview tr-demo" id="root">
<div class="tr-stack">
<div class="tr-progress">
<span id="p-progresso-demo-1">Enviando notas fiscais</span>
<div aria-labelledby="p-progresso-demo-1" aria-valuemax="30" aria-valuemin="0" aria-valuenow="12" aria-valuetext="12 de 30 arquivos" class="tr-progress__track" role="progressbar"><div class="tr-progress__bar" style="width:40%"></div></div>
<small>12 de 30 arquivos</small>
</div>
<div class="tr-progress tr-progress--indeterminate">
<span id="p-progresso-demo-2">Verificando arquivos</span>
<div aria-labelledby="p-progresso-demo-2" class="tr-progress__track" role="progressbar"><div class="tr-progress__bar"></div></div>
</div>
<div class="tr-progress">
<span id="p-progresso-demo-3">Armazenamento</span>
<div aria-labelledby="p-progresso-demo-3" aria-valuemax="50" aria-valuemin="0" aria-valuenow="18" aria-valuetext="18 gigabytes de 50 gigabytes" class="tr-progress__track" role="meter"><div class="tr-progress__bar" style="width:36%"></div></div>
<small>18 gigabytes de 50 gigabytes</small>
</div>
<div class="tr-row">
<div aria-labelledby="p-progresso-demo-4" aria-valuemax="100" aria-valuemin="0" aria-valuenow="60" class="tr-progress-ring" role="progressbar" style="--v:60"><span aria-hidden="true">60%</span></div>
<div class="tr-stack"><span id="p-progresso-demo-4">Gerando o relatório anual</span><div><button class="tr-btn tr-btn--subtle tr-btn--sm" type="button">Cancelar</button></div></div>
</div>
</div>
</div>
</body>
</html>
