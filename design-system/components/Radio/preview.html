<!-- @dsCard group="Seleção e entrada" height=576 subtitle="Radio" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Radio</title>
<style>
  html,body{margin:0;background:var(--t-bg);color:var(--t-fg-1);font:400 16px/24px var(--t-font-sans)}
  .tr-preview{display:grid;gap:var(--sp-400);padding:var(--sp-600);box-sizing:border-box}
  .tr-preview form{margin:0}
</style></head>
<body>
<div class="tr-preview tr-demo" id="root">
<form class="tr-stack" onsubmit="return false">
<fieldset class="tr-fieldset">
<legend>Onde você mora?</legend>
<label class="tr-check tr-check--radio"><input name="p-radio-regiao" type="radio" value="centro-oeste"/><span>Centro-Oeste</span></label>
<label class="tr-check tr-check--radio"><input name="p-radio-regiao" type="radio" value="nordeste"/><span>Nordeste</span></label>
<label class="tr-check tr-check--radio"><input name="p-radio-regiao" type="radio" value="norte"/><span>Norte</span></label>
<label class="tr-check tr-check--radio"><input name="p-radio-regiao" type="radio" value="sudeste"/><span>Sudeste</span></label>
<label class="tr-check tr-check--radio"><input name="p-radio-regiao" type="radio" value="sul"/><span>Sul</span></label>
<span class="tr-hint">ou</span>
<label class="tr-check tr-check--radio"><input name="p-radio-regiao" type="radio" value="exterior"/><span>Moro fora do Brasil</span></label>
</fieldset>
<fieldset aria-describedby="p-radio-pgto-erro" class="tr-fieldset">
<legend>Como prefere pagar?</legend>
<span class="tr-error-msg" id="p-radio-pgto-erro"><span class="tr-visually-hidden">Erro:</span>Selecione como prefere pagar</span>
<label class="tr-check tr-check--radio"><input name="p-radio-pgto" type="radio" value="pix"/><span>Pix</span></label>
<label class="tr-check tr-check--radio"><input name="p-radio-pgto" type="radio" value="boleto"/><span>Boleto</span></label>
</fieldset>
</form>
</div>
</body>
</html>
