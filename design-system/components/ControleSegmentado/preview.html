<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Controle segmentado</title>
<style>
  html,body{margin:0;background:var(--t-bg);color:var(--t-fg-1);font:400 16px/24px var(--t-font-sans)}
  .tr-preview{display:grid;gap:var(--sp-400);padding:var(--sp-600);box-sizing:border-box}
  .tr-preview form{margin:0}
</style></head>
<body>
<div class="tr-preview tr-demo" id="root">
<div class="tr-row">
<span class="tr-label" id="p-controle-segmentado-vis">Visualização</span>
<div aria-labelledby="p-controle-segmentado-vis" class="tr-seg" role="group">
<button aria-pressed="true" type="button">Lista</button>
<button aria-pressed="false" type="button">Grade</button>
<button aria-pressed="false" type="button">Calendário</button>
</div>
</div>
<div class="tr-row">
<span class="tr-label" id="p-controle-segmentado-per">Período</span>
<div aria-labelledby="p-controle-segmentado-per" class="tr-seg" role="group">
<button aria-pressed="false" type="button">7 dias</button>
<button aria-pressed="true" type="button">30 dias</button>
<button aria-pressed="false" type="button">12 meses</button>
</div>
</div>
</div>
</body>
</html>
