<!-- @dsCard group="Seleção e entrada" height=476 subtitle="Checkbox" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Checkbox</title>
<style>
  html,body{margin:0;background:var(--t-bg);color:var(--t-fg-1);font:400 16px/24px var(--t-font-sans)}
  .tr-preview{display:grid;gap:var(--sp-400);padding:var(--sp-600);box-sizing:border-box}
  .tr-preview form{margin:0}
</style></head>
<body>
<div class="tr-preview tr-demo" id="root">
<form class="tr-stack" onsubmit="return false">
<fieldset aria-describedby="p-checkbox-contato-hint" class="tr-fieldset">
<legend>Como podemos entrar em contato?</legend>
<span class="tr-hint" id="p-checkbox-contato-hint">Selecione todas as opções que se aplicam</span>
<label class="tr-check"><input checked="" name="p-checkbox-contato" type="checkbox" value="email"/><span>E-mail</span></label>
<label class="tr-check"><input name="p-checkbox-contato" type="checkbox" value="telefone"/><span>Ligação telefônica</span></label>
<label class="tr-check"><input name="p-checkbox-contato" type="checkbox" value="sms"/><span>SMS</span></label>
</fieldset>
<fieldset aria-describedby="p-checkbox-docs-erro" class="tr-fieldset">
<legend>Quais documentos você vai enviar?</legend>
<span class="tr-error-msg" id="p-checkbox-docs-erro"><span class="tr-visually-hidden">Erro:</span>Selecione pelo menos um documento</span>
<label class="tr-check"><input name="p-checkbox-docs" type="checkbox" value="cnh"/><span>Carteira de motorista</span></label>
<label class="tr-check"><input name="p-checkbox-docs" type="checkbox" value="rg"/><span>Carteira de identidade</span></label>
</fieldset>
<label class="tr-check"><input id="p-checkbox-termos" required="" type="checkbox"/><span>Li e aceito os termos de uso.</span></label>
</form>
</div>
</body>
</html>
