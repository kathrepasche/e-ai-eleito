<!-- @dsCard group="Menus e ações" height=98 subtitle="Barra de ferramentas" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Barra de ferramentas</title>
<style>
  html,body{margin:0;background:var(--t-bg);color:var(--t-fg-1);font:400 16px/24px var(--t-font-sans)}
  .tr-preview{display:grid;gap:var(--sp-400);padding:var(--sp-600);box-sizing:border-box}
  .tr-preview form{margin:0}
</style></head>
<body>
<div class="tr-preview tr-demo" id="root">
<div aria-label="Formatação do texto" class="tr-toolbar" role="toolbar">
<button aria-label="Desfazer" class="tr-btn tr-btn--subtle tr-btn--icon tr-btn--sm" title="Desfazer" type="button"><span aria-hidden="true">↶</span></button>
<button aria-label="Refazer" class="tr-btn tr-btn--subtle tr-btn--icon tr-btn--sm" title="Refazer" type="button"><span aria-hidden="true">↷</span></button>
<span aria-orientation="vertical" class="tr-toolbar__sep" role="separator"></span>
<button aria-label="Negrito" aria-pressed="true" class="tr-btn tr-btn--subtle tr-btn--icon tr-btn--sm" title="Negrito" type="button"><strong aria-hidden="true">N</strong></button>
<button aria-label="Itálico" aria-pressed="false" class="tr-btn tr-btn--subtle tr-btn--icon tr-btn--sm" title="Itálico" type="button"><em aria-hidden="true">I</em></button>
<button aria-label="Sublinhado" aria-pressed="false" class="tr-btn tr-btn--subtle tr-btn--icon tr-btn--sm" title="Sublinhado" type="button"><u aria-hidden="true">S</u></button>
<span aria-orientation="vertical" class="tr-toolbar__sep" role="separator"></span>
<button class="tr-btn tr-btn--subtle tr-btn--sm" type="button">Inserir tabela</button>
<span aria-orientation="vertical" class="tr-toolbar__sep" role="separator"></span>
<button aria-expanded="false" aria-haspopup="menu" aria-label="Mais opções de formatação" class="tr-btn tr-btn--subtle tr-btn--icon tr-btn--sm" title="Mais opções de formatação" type="button"><span aria-hidden="true">⋯</span></button>
<button class="tr-btn tr-btn--primary tr-btn--sm" type="button">Publicar</button>
</div>
</div>
</body>
</html>
