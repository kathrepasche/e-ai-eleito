<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Cobrar político</title>
<style>
  html,body{margin:0;background:var(--t-bg);color:var(--t-fg-1);font:400 16px/24px var(--t-font-sans)}
  .tr-preview{display:grid;gap:var(--sp-400);padding:var(--sp-600);box-sizing:border-box}

<body>
<div class="tr-preview tr-demo" id="root">
<section class="ee-cobrar" style="max-width:520px">
<h3 class="tr-title-3" style="margin:0">E aí, Marina? Cobre direto</h3>

<div class="tr-field"><label class="tr-label" for="msg">Mensagem pronta (edite como quiser)</label><textarea class="tr-textarea" id="msg">Olá, Marina. Vi que você não votou no projeto da bolsa para estagiários. Pode explicar sua posição?</textarea></div>
<div class="tr-btn-group"><button class="tr-btn tr-btn--primary" type="button">Copiar mensagem</button><button class="tr-btn" type="button">Abrir no e-mail</button></div>
</section>
</div>
