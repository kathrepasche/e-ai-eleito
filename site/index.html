:root[data-theme=dark]{--contorno:-1.5px -1.5px 0 #1B1B1F,1.5px -1.5px 0 #1B1B1F,-1.5px 1.5px 0 #1B1B1F,1.5px 1.5px 0 #1B1B1F,0 -1.5px 0 #1B1B1F,0 1.5px 0 #1B1B1F,-1.5px 0 0 #1B1B1F,1.5px 0 0 #1B1B1F}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}

.btn.pri{background:var(--tintabg);color:#fff}.btn.gri{background:var(--grifo);color:#1B1B1F}

.hero{background:#1B1B1F;color:#F7F5F0}

.li{display:flex;gap:10px;align-items:flex-start}.li svg{flex:none;margin-top:2px}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}

details{border-bottom:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:600;min-height:32px}

label{font-weight:600;font-size:15px}

.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}.check input{width:22px;height:22px;flex:none;margin-top:2px}

.passo{font-size:14px;color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--tintabg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.silencio{background:var(--aviso);border:1px solid var(--avisol);border-radius:14px;padding:12px 14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats .card{padding:14px;gap:2px}.stats b{font:700 26px 'Space Grotesk',sans-serif}
.item{display:flex;gap:12px}.item .dt{font-size:13px;color:var(--mute)}
.vazio{color:var(--mute)}
.placar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}.placar i{display:block;height:100%}
.voto-det{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0 14px}
.voto-det summary{display:flex;align-items:center;gap:10px;min-height:52px;list-style:none}.voto-det summary::-webkit-details-marker{display:none}
.voto-det summary b{margin-left:auto;font:700 20px 'Space Grotesk',sans-serif}.voto-det ul{margin:0 0 12px;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.tabela{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.tabela table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
.tabela th,.tabela td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tabela th{font-weight:600;font-size:14px}.tabela td.q{min-width:220px}.tabela tr:last-child td{border-bottom:0}
.ok{font-weight:600}.ok::before{content:'✓ ';color:var(--tinta)}
.perg{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.cargobar{position:sticky;top:var(--hh,64px);z-index:4;background:var(--bg);border-bottom:1px solid var(--line)}.cargobar .chips{flex-wrap:nowrap;overflow-x:auto}.cargobar .chip{flex:none}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--mute);background:var(--card);color:var(--ink);padding:12px;font:16px/1.5 Inter,sans-serif;margin-top:6px;resize:vertical}
.contato{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.contato .card{padding:12px;gap:2px}.contato b{overflow-wrap:anywhere}
@media(max-width:600px){.contato{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){.princ{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.hero .wrap{grid-template-columns:minmax(0,1fr)}.pic{min-height:320px}.steps,.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.princ{grid-template-columns:minmax(0,1fr)}.stats b{font-size:22px}nav a{padding:0 8px}}
@media(prefers-reduced-motion:no-preference){.pic .mail{animation:sobe .7s ease-out both .2s}@keyframes sobe{from{transform:translateY(24px);opacity:0}}}
</style>

app.addEventListener('change',e=>{if(e.target.id==='uf'){S.uf=e.target.value;rerender()}if(e.target.id==='cargoE'){S.cargoE=e.target.value;S.cmp=null;render()}});
app.addEventListener('input',e=>{if(e.target.classList.contains('buscaC')){S.buscaC=e.target.value;const pos=e.target.selectionStart,id=e.target.id;render();const b=document.getElementById(id);b.focus();b.setSelectionRange(pos,pos);return}if(e.target.id==='busca'){S.busca=e.target.value;const pos=e.target.selectionStart;render();const b=document.getElementById('busca');b.focus();b.setSelectionRange(pos,pos)}});
app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='fEntrar'){const v=document.getElementById('emE').value.trim();document.getElementById('msgE').textContent=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?`Se ${v} estiver cadastrado, o link chega em instantes. No protótipo, nenhum e-mail é enviado.`:'Confira o e-mail: parece que falta algo.';return}const em=document.getElementById('em').value.trim(),lg=document.getElementById('lgpd').checked,er=document.getElementById('erro');
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){er.textContent='Confira o e-mail: parece que falta algo.';return}
if(!lg){er.textContent='Para continuar, marque a concordância com o uso dos dados.';return}
S.email=em;S.nome=document.getElementById('nome').value.trim();S.ok=true;S.passo=4;rerender();scrollTo(0,0)});
addEventListener('hashchange',()=>{if(location.hash==='#cadastro'&&S.passo===4)S.passo=1;S.filtroP='todas';S.picker=null;render();const c=S.irCobrar&&document.getElementById('cobrar');S.irCobrar=false;if(c)c.scrollIntoView();else scrollTo(0,0)});
render();
}
</script>
</body>
</html>
