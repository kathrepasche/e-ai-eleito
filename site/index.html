<title>E aí, Eleito?</title>
<!-- Design system E aí, Eleito?: tokens + componentes (.tr-* do Trama, .ee-* cívicos). As fontes vêm do @import do bundle. -->
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components/bundle.css">
<style>

*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--t-bg);color:var(--t-fg-1);font:400 16px/24px var(--font-sans);overflow-x:clip}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
a.tr-btn{text-decoration:none}
:focus-visible{outline:var(--stroke-thick) solid var(--t-focus);outline-offset:2px}
.band{padding:clamp(var(--sp-800),4vw,var(--sp-1600)) max(5vw,var(--sp-400))}
.wrap{max-width:1240px;margin:0 auto}
.col{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:var(--sp-500)}
.pilha{display:flex;flex-direction:column;gap:var(--sp-300)}
.linha{display:flex;flex-wrap:wrap;gap:var(--sp-200);align-items:center}
.entre{justify-content:space-between}
.apoio{color:var(--t-fg-3)}
.suave{color:var(--t-fg-2)}
.tracejado{border-style:dashed;border-color:var(--t-border)}
/* Cabeçalho */
.marca{display:flex;align-items:center;gap:var(--sp-300);text-decoration:none;color:var(--t-fg-1);margin-right:auto}
.marca strong{font:700 19px/24px var(--font-display)}
/* Abertura (faixa grafite) */
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--sp-1000);align-items:center}
.hero h1{font:700 clamp(36px,5vw,56px)/1.22 var(--font-display);letter-spacing:-0.015em}
.risca{text-decoration:line-through;text-decoration-thickness:4px;color:var(--t-fg-3)}
.hero .sub{font:400 18px/28px var(--font-sans);color:var(--t-fg-2);max-width:520px;margin:var(--sp-500) 0 var(--sp-600)}
.pic{position:relative;min-height:360px}
.pic .ico{position:absolute;left:4%;top:0;width:58%;max-width:300px}
.pic .mail{position:absolute;right:0;bottom:0;width:68%;max-width:360px;background:var(--t-surface-raised);border:var(--stroke-thin) solid var(--t-border-subtle);border-radius:var(--r-lg);padding:var(--sp-500);box-shadow:var(--e-5);display:grid;gap:var(--sp-300)}
.mail b{font:700 18px/24px var(--font-display)}
/* Grades */
.passos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-500);margin-top:var(--sp-600)}
.regras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-500);margin-top:var(--sp-600)}
.grade2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-400)}
.numeros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-300)}
.numeros .tr-card{gap:var(--sp-50);padding:var(--sp-300) var(--sp-400)}
.numeros b{font:700 28px/36px var(--font-display)}
.faixa-clara{background:var(--t-surface-1);border-block:var(--stroke-thin) solid var(--t-border-subtle)}
.tr-accordion details p{margin:0 0 var(--sp-400);color:var(--t-fg-2)}
.pres-ico{flex:none;width:var(--icon-md);height:var(--icon-md);color:var(--t-fg-1)}
.pres-ico svg{width:100%;height:100%}
.pergunta{display:grid;gap:var(--sp-300);padding:var(--sp-500) 0;border-bottom:var(--stroke-thin) solid var(--t-border-subtle)}
.pergunta .enunciado{font:400 18px/28px var(--font-sans)}
.tr-table-wrap{overflow-x:auto;border:var(--stroke-thin) solid var(--t-border-subtle);border-radius:var(--r-lg)}
.tr-table{min-width:560px}
.tr-table td.tema{min-width:220px}
.igual{font-weight:600}.igual::before{content:"✓ ";color:var(--t-brand)}
.ee-cargos{padding-inline:max(5vw,var(--sp-400))}
.cargo-sec{display:flex;flex-direction:column;gap:var(--sp-400);scroll-margin-top:72px}
.cargo-sec h2 .tr-body-sm{font-family:var(--font-sans);font-weight:400}
.pessoa{display:flex;align-items:center;gap:var(--sp-300)}
.pessoa .nome{font-weight:600}
.tr-avatar.avatar-grande{width:64px;height:64px;font-size:20px}
.rodape{padding:var(--sp-800) max(5vw,var(--sp-400));border-top:var(--stroke-thin) solid var(--t-border-subtle);color:var(--t-fg-2)}
@media(max-width:900px){.regras{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.hero .wrap{grid-template-columns:minmax(0,1fr)}.pic{min-height:330px}.passos,.grade2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.regras{grid-template-columns:minmax(0,1fr)}.numeros b{font-size:22px;line-height:28px}}
@media(prefers-reduced-motion:no-preference){.pic .mail{animation:sobe var(--m-slower) var(--m-ease-enter) both .2s}@keyframes sobe{from{transform:translateY(24px);opacity:0}}}
</style>
</head>

<div class="ee-politico__item">${VI('sim')}<p>Marina Duarte votou sim no horário estendido dos postos de saúde</p></div>
<div class="ee-politico__item">${VI('falta')}<p>Faltou à votação sobre golpes pelo celular</p></div>

</div></section>

<div class="tr-card"><h3 class="tr-subtitle">Leia em 2 minutos</h3><p>Toda segunda chega um e-mail só seu. No site, a página “Tô de olho” guarda o histórico completo de cada político.</p></div>
</div></div></section>

<details><summary>Vocês sabem em quem eu votei?</summary><p>Não. Você escolhe quem quer acompanhar, eleito ou não, e isso não revela seu voto.</p></details>
<details><summary>O que é “silêncio”?</summary><p>Quando o político não discursou nem apresentou projeto sobre uma pauta sua no período, avisamos. Não falar também é informação.</p></details>
</div><a class="${B.pri}" href="#cadastro" style="align-self:flex-start">Começar agora</a></div></section>`},

cadastro(){
if(S.passo===4)return `<section class="band"><div class="col" style="text-align:center;align-items:center">
<div style="width:120px">${ICON(0)}</div><h1 class="tr-title-1">Pronto, ${S.nome?esc(S.nome.split(' ')[0]):'tá feito'}!</h1>
<p>Seu primeiro resumo chega na próxima segunda, às 8h, em <strong>${esc(S.email)}</strong>.</p>
<p class="tr-body-sm apoio">No protótipo, nenhum e-mail é enviado.</p>
<a class="${B.pri}" href="#semana">Abrir o Tô de olho</a></div></section>`;
let corpo='';
if(S.passo===1){const lista=POL.filter(p=>!S.busca||p.n.toLowerCase().includes(S.busca.toLowerCase()));
const grupo=c=>lista.filter(p=>p.c===c).map(p=>{const on=S.seg.includes(p.id);return `<div class="tr-card"><div class="pessoa">${avatar(p)}<div style="flex:1"><p class="nome">${p.n}</p><p class="tr-body-sm apoio">${p.p}${p.m?' · '+p.m:''}</p></div><button type="button" class="${on?'tr-btn tr-btn--primary':'tr-btn'}" data-seg="${p.id}" aria-pressed="${on}">${on?'Tô de olho':'Ficar de olho'}</button></div></div>`}).join('')||'<p class="suave">Ninguém com esse nome.</p>';
corpo=`<h1 class="tr-title-1">De quem você quer ficar de olho?</h1><p class="suave">Siga quem você escolheu, eleito ou não. Ninguém fica sabendo em quem você votou.</p>
<div class="tr-field"><label class="tr-label" for="uf">Seu estado</label><select class="tr-select" id="uf"><option value="">Escolha</option>${UFS.map(u=>`<option ${S.uf===u?'selected':''}>${u}</option>`).join('')}</select></div>
${S.uf?`<div class="tr-field"><label class="tr-label" for="busca">Buscar por nome</label><input class="tr-input" id="busca" type="search" value="${esc(S.busca)}" placeholder="Ex.: Marina"></div>
<h2 class="tr-subtitle">Presidente da República <span class="tr-badge">sugestão</span></h2><div class="pilha">${grupo('pres')}</div><h2 class="tr-subtitle">Senadores de ${S.uf}</h2><div class="pilha">${grupo('sen')}</div><h2 class="tr-subtitle">Deputados federais de ${S.uf}</h2><div class="pilha">${grupo('dep')}</div>`:''}
<div class="linha entre"><span class="tr-body-sm apoio">${S.seg.length?'De olho em '+S.seg.length:'Ninguém no seu radar ainda'}</span><button type="button" class="${B.pri}" id="prox" ${S.seg.length?'':'disabled'}>Continuar</button></div>`}
if(S.passo===2){const n=S.pautas.length;
corpo=`<h1 class="tr-title-1">O que importa pra você?</h1><p class="suave">Escolha de 3 a 5 pautas, ou acompanhe todas.</p>
${pauta('id="todas" style="justify-content:center;min-height:var(--c-h-lg)"','Todas as pautas',S.todas)}
<p class="tr-body-sm apoio" style="text-align:center">ou escolha</p>
<div class="linha">${PAUTAS.map(p=>pauta(`data-pa="${p}"`,p,S.todas||S.pautas.includes(p))).join('')}</div>
<p class="tr-body-sm apoio" role="status">${S.todas?'Acompanhando todas as pautas':n<3?`Escolha mais ${3-n}`:`${n} de 5 escolhidas`}</p>
<div class="linha entre"><button type="button" class="tr-btn tr-btn--subtle tr-btn--lg" id="volta">Voltar</button><button type="button" class="${B.pri}" id="prox" ${S.todas||n>=3?'':'disabled'}>Continuar</button></div>`}
if(S.passo===3)corpo=`<h1 class="tr-title-1">Para onde mandamos seu resumo?</h1><p class="suave">Um e-mail por semana, toda segunda às 8h. Sem propaganda.</p>
<form id="f" class="pilha" style="gap:var(--sp-600)" novalidate>
<div class="tr-field"><label class="tr-label" for="nome">Como podemos te chamar? <span class="tr-hint">(opcional)</span></label><input class="tr-input" id="nome" type="text" autocomplete="given-name" value="${esc(S.nome)}"></div>
<div class="tr-field"><label class="tr-label" for="em">Seu e-mail</label><input class="tr-input" id="em" type="email" autocomplete="email" required aria-describedby="erro" value="${esc(S.email)}"><p class="tr-error-msg" id="erro" role="alert"></p></div>
<label class="tr-check"><input type="checkbox" id="lgpd" required><span>Concordo em receber o resumo semanal e com o uso dos meus dados só para isso, conforme a LGPD. Posso cancelar quando quiser.</span></label>
<div class="linha entre"><button type="button" class="tr-btn tr-btn--subtle tr-btn--lg" id="volta">Voltar</button><button class="${B.pri}" type="submit">Começar a receber</button></div></form>`;
const etapas=['Políticos','Pautas','E-mail'];
return `<section class="band"><div class="col"><ol class="tr-steps" aria-label="Etapas do cadastro">${etapas.map((t,i)=>`<li ${i+1<S.passo?'data-state="done"':''} ${i+1===S.passo?'aria-current="step"':''}>${t}</li>`).join('')}</ol>${corpo}</div></section>`},

semana(){
const secoes=[['pres','Presidente',true],['sen','Senadores',true],['dep','Deputados federais',true],['est','Deputados estaduais',false],['ver','Vereadores',false]];
const topo=p=>`<div class="ee-politico__topo">${avatar(p)}<div style="flex:1"><h3 class="ee-politico__nome">${p.n}</h3><p class="ee-politico__meta">${CARGO[p.c]} · ${p.p} · ${onde(p)}</p></div><button type="button" class="tr-btn tr-btn--subtle tr-btn--sm" data-unf="${p.id}" aria-label="Parar de ficar de olho em ${p.n}">Tirar o olho</button></div>`;
const card=p=>{if(p.c==='pres'){const ds=PRES.filter(d=>d.d>=SEM_INI&&d.d<=SEM_FIM&&minhas().includes(d.pa));
return `<article class="ee-politico">${topo(p)}
${ds.length?`<p><strong>${ds.length} decis${ds.length===1?'ão':'ões'}</strong> sobre as suas pautas nessa semana.</p>${ds.map(linhaPres).join('')}`:'<p class="suave">Nenhuma decisão sobre as suas pautas nessa semana.</p>'}
<div class="ee-politico__acoes"><a class="tr-btn" href="#perfil-${p.id}">Ver todas as decisões</a><a class="tr-btn tr-btn--subtle" href="#perfil-${p.id}" data-cobrar="1">Cobrar</a></div></article>`}
const vs=VOT.filter(v=>v.casa===p.c&&v.d>=SEM_INI&&v.d<=SEM_FIM&&minhas().includes(v.pa));
const fal=(FALAS[p.id]||[]).filter(x=>x[0]>=SEM_INI&&x[0]<=SEM_FIM&&minhas().includes(x[1]));
const sil=silencios(p,'2026-10-24',SEM_FIM).slice(0,2);
const pres=vs.filter(v=>voto(p.id,v.id)!=='falta').length;
return `<article class="ee-politico">${topo(p)}
${vs.length?`<p><strong>Votou em ${pres} de ${vs.length}</strong> votaç${vs.length===1?'ão':'ões'} das suas pautas.</p>`:'<p class="suave">Nenhuma votação das suas pautas esta semana.</p>'}
${vs.map(v=>linhaVoto(p,v)).join('')}
${fal.map(x=>`<div class="ee-politico__item">${VI('fala')}<div><span class="ee-politico__data">${dt(x[0])} · ${x[1]}</span><strong>Discursou</strong> sobre ${x[1].toLowerCase()} no plenário.</div></div>`).join('')}
${sil.length?`<div class="ee-silencio">Faz 30 dias que não fala de <strong>${sil.join(' nem de ').toLowerCase()}</strong>. E aí, eleito?</div>`:''}
<div class="ee-politico__acoes"><a class="tr-btn" href="#perfil-${p.id}">Ver histórico completo</a><a class="tr-btn tr-btn--subtle" href="#perfil-${p.id}" data-cobrar="1">Cobrar</a></div></article>`};
const picker=c=>{const q=(S.buscaC||'').toLowerCase();const op=POL.filter(p=>p.c===c&&!S.seg.includes(p.id)&&(!q||p.n.toLowerCase().includes(q)));
return `<div class="tr-card tracejado"><div class="tr-field"><label class="tr-label" for="bc-${c}">Em quem mais você quer ficar de olho?</label><input class="tr-input buscaC" id="bc-${c}" type="search" value="${esc(S.buscaC||'')}" placeholder="Nome ${c==='sen'?'do senador ou da senadora':c==='pres'?'':'do deputado ou da deputada'}${S.uf?' de '+S.uf:''}"></div>
${op.map(p=>`<div class="pessoa">${avatar(p)}<div style="flex:1"><p class="nome">${p.n}</p><p class="tr-body-sm apoio">${p.p}${p.m?' · '+p.m:''}</p></div><button type="button" class="tr-btn" data-seg="${p.id}">Ficar de olho</button></div>`).join('')||'<p class="suave">Ninguém com esse nome por aqui.</p>'}
<button type="button" class="tr-btn tr-btn--subtle" style="justify-self:start" data-pick="">Pronto</button></div>`};
const sugestao=()=>{const p=pol('pr');return `<div class="tr-card tracejado"><span class="tr-badge tr-badge--brand" style="justify-self:start">Sugestão para você</span><div class="pessoa">${avatar(p)}<div style="flex:1"><p class="nome">${p.n}</p><p class="tr-body-sm apoio">${CARGO.pres} · ${p.p} · Brasil</p></div></div><p class="suave">Sanções, vetos e medidas provisórias sobre as suas pautas, ligados ao que seus políticos votaram.</p><div class="tr-btn-group"><button type="button" class="tr-btn tr-btn--primary" data-seg="pr">Ficar de olho</button><button type="button" class="tr-btn tr-btn--subtle" data-ocultar="pres">Agora não, ocultar cargo</button></div></div>`};
const sec=([c,t,ok])=>{const seg=S.seg.map(pol).filter(p=>p.c===c);
return `<section class="cargo-sec" id="sec-${c}">
<div class="linha"><h2 class="tr-title-3" style="flex:1">${t} <span class="tr-body-sm apoio">${ok?(seg.length?'de olho em '+seg.length:'ninguém no seu radar ainda'):'em breve'}</span></h2>
${c==='pres'?`<button type="button" class="tr-btn tr-btn--subtle" data-ocultar="pres">Ocultar cargo</button>`:ok&&S.picker!==c?`<button type="button" class="tr-btn" data-pick="${c}">+ ${seg.length?'Ficar de olho em mais um':'Ficar de olho em alguém'}</button>`:''}</div>
${ok&&S.picker===c?picker(c):''}
${!ok?`<div class="tr-card tracejado"><p class="suave">Logo, logo a gente fica de olho neles também. Enquanto isso, <a class="tr-link" href="#cargos">veja o que esse cargo faz</a>.</p></div>`
:seg.length?`<div class="grade2">${seg.map(card).join('')}</div>`
:c==='pres'?sugestao():S.picker===c?'':`<div class="tr-card tracejado" style="min-height:120px;align-content:center"><p class="suave">Por aqui, nenhum ${c==='sen'?'senador':'deputado federal'} sabe que você está de olho. Ainda.</p></div>`}
</section>`};
const vis=secoes.filter(([c])=>!S.ocultos.includes(c));
return `<nav class="ee-cargos" aria-label="Cargos">${vis.map(([c,t,ok])=>`<button type="button" data-ir="${c}" ${S.irAtual===c?'aria-current="true"':''}>${t}${ok?` <span class="ee-cargos__n">${S.seg.map(pol).filter(p=>p.c===c).length}</span>`:''}</button>`).join('')}</nav>
<section class="band" style="padding-top:var(--sp-500)"><div class="wrap pilha" style="gap:var(--sp-800)">
<div class="tr-card" style="grid-template-columns:1fr auto;align-items:center"><p class="tr-body-sm">Pautas: <strong>${S.todas?'todas':S.pautas.join(', ')}</strong>${S.ok?` · resumo em ${esc(S.email)}`:' · sem e-mail cadastrado'}</p><a class="tr-btn" href="#preferencias">Mudar preferências</a></div>
<div class="pilha"><p class="tr-body-sm apoio">Fique de olho nessa semana · 16 a 22 de novembro</p><h1 class="tr-title-1">Tô de olho em <span class="ee-grifo">${S.seg.length} polític${S.seg.length===1?'o':'os'}</span></h1>${S.uf?'':'<p class="suave"><a class="tr-link" href="#cadastro" data-ed="1">Escolha seu estado</a> para ver os políticos de lá.</p>'}</div>
${vis.map(sec).join('')}
${S.ocultos.length?`<p class="tr-body-sm apoio">Cargo oculto: ${S.ocultos.map(c=>secoes.find(x=>x[0]===c)[1]).join(', ')} · <button type="button" class="tr-btn tr-btn--subtle tr-btn--sm" data-mostrar="1">Mostrar de novo</button></p>`:''}
</div></section>`},

cargos(){const C=[['Presidente da República','Federal · 4 anos · 1 no país',['Sanciona ou veta as leis aprovadas pelo Congresso','Edita medidas provisórias e decretos','Comanda os ministérios e o governo federal'],'Criar lei sozinho: medida provisória só continua valendo se o Congresso aprovar',true],
['Deputado federal','Federal · 4 anos · 513 no país',['Cria e vota leis que valem para o país todo','Aprova o orçamento federal e indica emendas','Fiscaliza o governo federal'],'Administrar hospital, escola ou posto: isso é de prefeito, governador ou presidente',true],
['Senador','Federal · 8 anos · 81 no país, 3 por estado',['Revisa e vota as leis aprovadas pela Câmara','Aprova indicações como ministros do STF','Representa o seu estado no Congresso'],'Executar obras ou contratar serviços diretamente',true],
['Deputado estadual','Estadual · 4 anos',['Cria leis do estado','Aprova o orçamento estadual','Fiscaliza o governador'],'Leis federais, como as da aposentadoria do INSS',false],
['Vereador','Municipal · 4 anos',['Cria leis da cidade','Aprova o orçamento da prefeitura','Fiscaliza o prefeito'],'Asfaltar rua ou contratar médico: quem executa é a prefeitura',false]];
return `<section class="band"><div class="wrap pilha" style="gap:var(--sp-600)"><div class="pilha"><h1 class="tr-title-1">O que cada cargo faz</h1><p class="suave">Saber o que é responsabilidade de quem ajuda a cobrar a pessoa certa.</p></div>
<div class="grade2">${C.map(([n,m,faz,nao,ok])=>`<article class="tr-card"><h2 class="tr-title-3">${n}</h2><p class="tr-body-sm apoio">${m}</p>
<h3 class="tr-subtitle">O que faz</h3>${faz.map(x=>`<div class="ee-politico__item">${VI('sim')}<p>${x}</p></div>`).join('')}
<h3 class="tr-subtitle">O que não é com ele</h3><div class="ee-politico__item">${VI('nao')}<p>${nao}</p></div>
<span class="tr-badge ${ok?'tr-badge--brand':''}" style="justify-self:start">${ok?'Acompanhamento disponível':'Acompanhamento em breve'}</span></article>`).join('')}</div></div></section>`},

perfil(id){const p=pol(id);if(!p)return views.semana();
const filtros=lista=>`<div class="linha" aria-label="Filtrar por pauta">${['todas',...new Set(lista)].map(k=>pauta(`data-fp="${k}"`,k==='todas'?'Todas':k,S.filtroP===k)).join('')}</div>`;
const cabeca=`<a class="tr-btn tr-btn--subtle" href="#semana" style="align-self:flex-start">← Tô de olho</a>
<div class="pessoa">${avatar(p,true)}<div><h1 class="tr-title-1">${p.n}</h1><p class="tr-body-sm apoio">${CARGO[p.c]} · ${p.p}${p.c==='pres'?'':' · '+onde(p)}</p></div></div>`;
if(p.c==='pres'){const ds=PRES.filter(d=>S.filtroP==='todas'||d.pa===S.filtroP);
return `<section class="band"><div class="col">${cabeca}
<div class="numeros"><div class="tr-card"><b>${PRES.filter(d=>d.t==='san').length}</b><span class="tr-body-sm apoio">leis sancionadas</span></div><div class="tr-card"><b>${PRES.filter(d=>d.t==='vet').length}</b><span class="tr-body-sm apoio">vetos</span></div><div class="tr-card"><b>${PRES.filter(d=>d.t==='mp').length}</b><span class="tr-body-sm apoio">medidas provisórias</span></div></div>
<div class="tr-msg"><span class="tr-msg__icon" aria-hidden="true">i</span><div><p class="tr-msg__title">Como funciona</p><p>O Congresso vota a lei e o presidente sanciona ou veta. Um veto pode ser derrubado pelo Congresso. Medidas provisórias valem na hora, mas precisam ser aprovadas pelo Congresso em até 120 dias.</p></div></div>
<section class="ee-cobrar" id="cobrar"><h2 class="tr-title-3">E aí, presidente? Cobre direto</h2><p>Mande sua pergunta pelo Fala.BR, o canal de ouvidoria do governo federal, ou pelas redes oficiais da Presidência.</p><div class="tr-field" style="max-width:none"><label class="tr-label" for="msg">Mensagem pronta (edite como quiser)</label><textarea class="tr-textarea" id="msg">${esc(`Olá. Sou eleitor(a) de ${S.uf||'meu estado'} e acompanho as decisões da Presidência. Gostaria de entender os motivos do veto à lei que permite usar parte do FGTS para quitar dívidas no cartão.`)}</textarea></div><div class="tr-btn-group"><button type="button" class="tr-btn tr-btn--primary" id="copiar">Copiar mensagem</button><span class="tr-body-sm apoio" id="copiado" role="status"></span></div></section>
${filtros(PRES.map(d=>d.pa))}
<h2 class="tr-title-3">Todas as decisões</h2>${ds.map(d=>`<div class="tr-card">${linhaPres(d)}</div>`).join('')||'<p class="suave">Nenhuma decisão nessa pauta.</p>'}
<p class="tr-body-sm apoio">Decretos entram numa próxima versão.</p></div></section>`}
const vs=VOT.filter(v=>v.casa===p.c&&(S.filtroP==='todas'||v.pa===S.filtroP)).sort((a,b)=>b.d.localeCompare(a.d));
const todos=VOT.filter(v=>v.casa===p.c);const pres=Math.round(todos.filter(v=>voto(p.id,v.id)!=='falta').length/todos.length*100);
const sil=silencios(p,'2026-08-24',SEM_FIM);
const k=contato(p);
const tipos=['sim','nao','abst','falta'];const rot={sim:'Votou a favor',nao:'Votou contra',abst:'Absteve-se',falta:'Faltou'};
const g=Object.fromEntries(tipos.map(t=>[t,todos.filter(v=>voto(p.id,v.id)===t).sort((a,b)=>b.d.localeCompare(a.d))]));
return `<section class="band"><div class="col">${cabeca}
<div class="numeros"><div class="tr-card"><b>${pres}%</b><span class="tr-body-sm apoio">presença em votações</span></div><div class="tr-card"><b>${todos.filter(v=>minhas().includes(v.pa)).length}</b><span class="tr-body-sm apoio">votações nas suas pautas</span></div><div class="tr-card"><b>${(FALAS[p.id]||[]).length}</b><span class="tr-body-sm apoio">discursos no período</span></div></div>
<section class="ee-cobrar" id="cobrar"><h2 class="tr-title-3">E aí, ${p.n.split(' ')[0]}? Cobre direto</h2>
<div class="ee-cobrar__contatos"><div class="ee-cobrar__contato">E-mail do gabinete<b>${k.email}</b></div><div class="ee-cobrar__contato">Telefone do gabinete<b>${k.fone}</b></div><div class="ee-cobrar__contato">Redes sociais<b>${k.rede}</b></div></div>
<div class="tr-field" style="max-width:none"><label class="tr-label" for="msg">Mensagem pronta (edite como quiser)</label><textarea class="tr-textarea" id="msg">${esc(msgPadrao(p))}</textarea></div>
<div class="tr-btn-group"><button type="button" class="tr-btn tr-btn--primary" id="copiar">Copiar mensagem</button><a class="tr-btn" id="mail" href="mailto:${k.email}?subject=${encodeURIComponent('Pergunta de um eleitor')}">Abrir no e-mail</a><span class="tr-body-sm apoio" id="copiado" role="status"></span></div>
<p class="tr-body-sm apoio">Também dá para ligar de graça: ${k.geral}. Seja direto e respeitoso: mensagens educadas costumam ter resposta.</p></section>
<section class="pilha"><h2 class="tr-title-3">Como votou</h2><p class="suave">${todos.length} votações nominais no período. Toque em cada tipo para ver em quais foram.</p>
<div class="ee-placar" role="img" aria-label="${tipos.map(t=>rot[t]+': '+g[t].length).join(', ')}">${tipos.map(t=>`<i class="${t}" style="width:${g[t].length/todos.length*100}%"></i>`).join('')}</div>
${tipos.map(t=>`<details class="ee-placar-linha"><summary>${VI(t)}<span>${rot[t]}</span><b>${g[t].length}</b></summary>${g[t].length?`<ul>${g[t].map(v=>`<li><span class="ee-politico__data">${dt(v.d)} · ${v.pa}</span>${v.f} <span class="apoio">(${v.r.toLowerCase()})</span></li>`).join('')}</ul>`:'<p class="suave" style="margin:0 0 var(--sp-300)">Nenhuma.</p>'}</details>`).join('')}</section>
<h2 class="tr-title-3">Histórico completo</h2>
${filtros(todos.map(v=>v.pa))}
${sil.length?`<div class="ee-silencio">Nos últimos 3 meses, nenhuma palavra sobre <strong>${sil.slice(0,3).join(', ').toLowerCase()}</strong>. E aí, eleito?</div>`:''}
${vs.map(v=>`<div class="tr-card">${linhaVoto(p,v)}</div>`).join('')||'<p class="suave">Nenhuma votação nessa pauta.</p>'}
<p class="tr-body-sm apoio">Votações simbólicas não registram o voto de cada parlamentar e não aparecem aqui.</p>
</div></section>`}};

views.eleicao=function(){
const abas=[['balanco','Balanço do mandato'],['form','O que você pensa'],['comp','Comparativo']];
const topo=`<div class="pilha"><p class="tr-body-sm apoio">Modo eleição</p><h1 class="tr-title-1">Fica ou troca? <span class="ee-grifo">Você decide.</span></h1><p class="suave">Compare o que seus políticos fizeram com o que você pensa. Suas respostas ficam só neste aparelho, nunca são somadas às de outras pessoas e não viram recomendação de voto.</p></div>
<div class="tr-tabs" role="tablist" aria-label="Modo eleição">${abas.map(([k,t])=>`<button type="button" class="tr-tab" role="tab" data-aba="${k}" aria-selected="${S.abaE===k}">${t}</button>`).join('')}</div>`;
const segs=S.seg.map(pol).filter(p=>p&&p.c!=='pres');
let corpo='';
if(S.abaE==='balanco'){corpo=segs.length?`<div class="grade2">${segs.map(p=>{const vs=VOT.filter(v=>v.casa===p.c);const pres=Math.round(vs.filter(v=>voto(p.id,v.id)!=='falta').length/vs.length*100);
const porPauta=[...new Set(vs.map(v=>v.pa))].filter(x=>minhas().includes(x)).map(pa=>{const o=vs.filter(v=>v.pa===pa).map(v=>voto(p.id,v.id));return `<p><strong>${pa}:</strong> ${o.map(x=>RT[x].toLowerCase()).join(', ')}</p>`}).join('');
const sil=silencios(p,'2026-08-24',SEM_FIM);
return `<article class="ee-politico"><div class="ee-politico__topo">${avatar(p)}<div><h2 class="ee-politico__nome">${p.n}</h2><p class="ee-politico__meta">${CARGO[p.c]} · ${p.p}</p></div></div>
<div class="numeros" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="tr-card"><b>${pres}%</b><span class="tr-body-sm apoio">presença em votações</span></div><div class="tr-card"><b>${(FALAS[p.id]||[]).length}</b><span class="tr-body-sm apoio">discursos</span></div></div>
<h3 class="tr-subtitle">Nas suas pautas</h3>${porPauta||'<p class="suave">Nenhuma votação nas suas pautas.</p>'}
${sil.length?`<div class="ee-silencio">Ficou em silêncio sobre <strong>${sil.slice(0,3).join(', ').toLowerCase()}</strong>.</div>`:''}
<div class="ee-politico__acoes"><a class="tr-btn" href="#perfil-${p.id}">Ver histórico completo</a></div></article>`}).join('')}</div>`
:`<div class="tr-card tracejado"><p class="suave">Você ainda não ficou de olho em nenhum parlamentar, então não há mandato para avaliar. Dá para ir direto para “O que você pensa”.</p></div>`;
corpo+=`<button type="button" class="${B.pri}" style="align-self:flex-start" data-aba="form">Agora, o que você pensa?</button>`}
if(S.abaE==='form'){const qs=VOT.filter(v=>v.casa===S.cargoE);const n=qs.filter(v=>S.resp[v.id]).length;
corpo=`<div class="tr-field"><label class="tr-label" for="cargoE">Cargo que você quer avaliar</label><select class="tr-select" id="cargoE"><option value="dep" ${S.cargoE==='dep'?'selected':''}>Deputado federal</option><option value="sen" ${S.cargoE==='sen'?'selected':''}>Senador</option></select></div>
<p class="tr-body-sm apoio">${n} de ${qs.length} respondidas · as perguntas vêm de votações reais do mandato</p>
<div>${qs.map(v=>`<div class="pergunta"><span class="tr-badge" style="justify-self:start">${v.pa}</span><p class="enunciado">Proposta: <strong>${v.f}</strong>. Você é a favor?</p>
<div class="linha" role="group" aria-label="Sua resposta">${['sim','nao','tf'].map(o=>pauta(`data-r="${v.id}:${o}"`,RT[o],S.resp[v.id]===o)).join('')}
${pauta(`data-imp="${v.id}"`,'Importante pra mim',S.imp[v.id])}</div>
<button type="button" class="tr-link" style="justify-self:start;background:none;border:0;padding:0;font:inherit;cursor:pointer;min-height:var(--c-touch)" data-exp="${v.id}" aria-expanded="${!!S.abertos[v.id]}" aria-controls="exp-${v.id}">${S.abertos[v.id]?'Fechar explicação':'Entender a proposta'}</button>
${S.abertos[v.id]&&EXP[v.id]?`<dl class="ee-proposta" id="exp-${v.id}"><dt>O que muda</dt><dd>${EXP[v.id][0]}</dd><dt>Quem é a favor diz</dt><dd>${EXP[v.id][1]}</dd><dt>Quem é contra diz</dt><dd>${EXP[v.id][2]}</dd><dd class="tr-body-sm apoio">Resultado no Congresso: ${v.r.toLowerCase()} em ${dt(v.d)} · <a class="tr-link" href="${fonte(v.casa)}">Texto completo na fonte oficial</a></dd></dl>`:''}</div>`).join('')}</div>
<button type="button" class="${B.pri}" style="align-self:flex-start" data-aba="comp" ${n?'':'disabled'}>Ver comparativo</button>`}
if(S.abaE==='comp'){const qs=VOT.filter(v=>v.casa===S.cargoE&&S.resp[v.id]);
const todos=[...POL.filter(p=>p.c===S.cargoE),...CAND.filter(k=>k.c===S.cargoE)].sort((a,b)=>a.n.localeCompare(b.n));
if(!S.cmp)S.cmp=[...todos.filter(p=>S.seg.includes(p.id)).map(p=>p.id),...CAND.filter(k=>k.c===S.cargoE).map(k=>k.id)].slice(0,3);
const sel=todos.filter(p=>S.cmp.includes(p.id));
const val=(p,v)=>CAND.includes(p)?respCand(p.id,v.id):voto(p.id,v.id);
const conta=p=>{let c=0,t=0;qs.forEach(v=>{const u=S.resp[v.id];if(u==='tf')return;const w=S.imp[v.id]?2:1;t+=w;if(val(p,v)===u)c+=w});return [c,t]};
corpo=!qs.length?`<div class="tr-card tracejado"><p class="suave">Responda pelo menos uma pergunta em “O que você pensa” para comparar.</p><button type="button" class="tr-btn tr-btn--primary" style="justify-self:start" data-aba="form">Responder</button></div>`:
`<div class="pilha"><p class="tr-label">Escolha até 3 para comparar <span class="tr-hint">(em ordem alfabética)</span></p><div class="linha">${todos.map(p=>pauta(`data-cmp="${p.id}"`,`${p.n}${S.seg.includes(p.id)?' · de olho':''}${CAND.includes(p)?' · candidato':''}`,S.cmp.includes(p.id))).join('')}</div></div>
<div class="tr-table-wrap"><table class="tr-table"><caption class="tr-visually-hidden">Comparativo das suas respostas com cada político</caption><thead><tr><th scope="col">Tema</th><th scope="col">Você</th>${sel.map(p=>`<th scope="col">${p.n}<br><span class="tr-body-sm apoio" style="font-weight:400">${CAND.includes(p)?'respostas ao questionário':'como votou no mandato'}</span></th>`).join('')}</tr></thead><tbody>
${qs.map(v=>`<tr><td class="tema">${v.f}${S.imp[v.id]?' <span class="tr-badge">importante</span>':''}</td><td><strong>${RT[S.resp[v.id]]}</strong></td>${sel.map(p=>{const x=val(p,v);return `<td class="${x===S.resp[v.id]?'igual':''}">${RT[x]}</td>`}).join('')}</tr>`).join('')}
<tr><td class="tema"><strong>Concordou com você</strong> <span class="tr-body-sm apoio">(temas importantes contam em dobro; “tanto faz” não conta)</span></td><td></td>${sel.map(p=>{const[c,t]=conta(p);return `<td><strong>${c} de ${t}</strong></td>`}).join('')}</tr>
</tbody></table></div>
<p class="tr-body-sm apoio">✓ = igual à sua resposta. Isto não é recomendação de voto nem pesquisa eleitoral: mostra só como cada um votou ou respondeu nos temas que você escolheu. Candidatos sem mandato aparecem com as respostas que enviaram ao nosso questionário. Bens declarados e plano de governo estão na ficha de cada candidato no TSE.</p>`}
return `<section class="band"><div class="col" style="max-width:900px">${topo}${corpo}</div></section>`};
views.preferencias=function(){if(!S.ok&&!S.seg.length)return views.entrar();
return `<section class="band"><div class="col"><h1 class="tr-title-1">Preferências</h1>
<div class="tr-card"><h2 class="tr-subtitle">Você está de olho em</h2><p>${S.seg.length?S.seg.map(pol).map(p=>p.n).join(', '):'Nenhum ainda'}</p><a class="tr-btn" style="justify-self:start" href="#cadastro" data-ed="1">Mudar de quem estou de olho</a></div>
${S.ocultos.length?`<div class="tr-card"><h2 class="tr-subtitle">Cargos ocultos</h2><p>Presidente</p><button type="button" class="tr-btn" style="justify-self:start" data-mostrar="1">Mostrar de novo</button></div>`:''}
<div class="tr-card"><h2 class="tr-subtitle">Pautas</h2><p>${S.todas?'Todas as pautas':S.pautas.join(', ')}</p><a class="tr-btn" style="justify-self:start" href="#cadastro" data-ed="2">Mudar pautas</a></div>
<div class="tr-card"><h2 class="tr-subtitle">Resumo por e-mail</h2><p>${S.ok?`Toda segunda, às 8h, em <strong>${esc(S.email)}</strong>`:'Nenhum e-mail cadastrado'}</p><a class="tr-btn" style="justify-self:start" href="#cadastro" data-ed="3">${S.ok?'Mudar e-mail':'Cadastrar e-mail'}</a></div>
<div class="tr-card"><h2 class="tr-subtitle">Seus dados</h2><p class="suave">Guardamos só seu e-mail, estado, quem você acompanha e suas pautas. Nunca em quem você votou.</p><div class="tr-btn-group"><button type="button" class="tr-btn" id="sair">Sair deste aparelho</button><button type="button" class="tr-btn tr-btn--subtle" id="apagar">Apagar minha conta</button></div><p class="tr-body-sm apoio" id="apagarMsg" role="status"></p></div>
</div></section>`};
views.entrar=function(){return `<section class="band"><div class="col"><h1 class="tr-title-1">Entrar</h1><p class="suave">Sem senha: digite seu e-mail e enviamos um link de acesso. É o mesmo link que vem no resumo de toda segunda.</p>
<form id="fEntrar" class="pilha" novalidate><div class="tr-field"><label class="tr-label" for="emE">Seu e-mail</label><input class="tr-input" id="emE" type="email" autocomplete="email" required></div><button class="${B.pri}" type="submit" style="align-self:flex-start">Enviar link de acesso</button><p class="tr-body-sm" id="msgE" role="status"></p></form>
<p class="tr-body-sm apoio">Ainda não tem cadastro? <a class="tr-link" href="#cadastro">Comece aqui</a>.</p></div></section>`};
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function render(){const nc=document.getElementById('navConta');nc.textContent=S.ok?'Preferências':'Entrar';nc.href=S.ok?'#preferencias':'#entrar';nc.dataset.v=S.ok?'preferencias':'entrar';const h=(location.hash||'#inicio').slice(1);let v=h.startsWith('perfil-')?'perfil':(views[h]?h:'inicio');
app.innerHTML=v==='perfil'?views.perfil(h.slice(7)):views[v]();
document.querySelectorAll('.tr-header__nav a').forEach(a=>{const on=a.dataset.v===v||(v==='perfil'&&a.dataset.v==='semana');if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
const rerender=()=>{render();salva()};

app.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;
if(t.dataset.seg){const id=t.dataset.seg;S.seg=S.seg.includes(id)?S.seg.filter(x=>x!==id):[...S.seg,id];rerender()}
else if(t.dataset.pa){const p=t.dataset.pa;if(S.todas){S.todas=false;S.pautas=[p]}else if(S.pautas.includes(p))S.pautas=S.pautas.filter(x=>x!==p);else if(S.pautas.length<5)S.pautas=[...S.pautas,p];rerender()}
else if(t.id==='todas'){S.todas=!S.todas;rerender()}
else if(t.id==='prox'){S.passo++;rerender();scrollTo(0,0)}
else if(t.id==='volta'){S.passo--;rerender()}
else if(t.dataset.fp){S.filtroP=t.dataset.fp;render()}
else if(t.dataset.ed){S.passo=+t.dataset.ed}
else if(t.dataset.cobrar){S.irCobrar=true}
else if(t.dataset.aba){S.abaE=t.dataset.aba;render();scrollTo(0,0)}
else if(t.dataset.r){const[q,o]=t.dataset.r.split(':');S.resp[q]=S.resp[q]===o?undefined:o;render()}
else if(t.dataset.exp){S.abertos[t.dataset.exp]=!S.abertos[t.dataset.exp];render()}
else if(t.dataset.imp){S.imp[t.dataset.imp]=!S.imp[t.dataset.imp];render()}
else if(t.dataset.cmp){const id=t.dataset.cmp;S.cmp=S.cmp.includes(id)?S.cmp.filter(x=>x!==id):S.cmp.length<3?[...S.cmp,id]:S.cmp;render()}
else if(t.dataset.ocultar){S.ocultos=[...new Set([...S.ocultos,t.dataset.ocultar])];S.seg=S.seg.filter(x=>x!=='pr');rerender()}
else if(t.dataset.mostrar){S.ocultos=[];rerender()}
else if(t.dataset.unf){S.seg=S.seg.filter(x=>x!==t.dataset.unf);rerender()}
else if(t.dataset.pick!==undefined){S.picker=t.dataset.pick||null;S.buscaC='';render();const i=document.querySelector('.buscaC');if(i)i.focus()}
else if(t.dataset.ir){S.irAtual=t.dataset.ir;document.querySelectorAll('.ee-cargos button').forEach(b=>b.toggleAttribute('aria-current',b===t));if(t.hasAttribute('aria-current'))t.setAttribute('aria-current','true');const el=document.getElementById('sec-'+t.dataset.ir);if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
else if(t.id==='sair'){S={...S,seg:[],email:'',nome:'',ok:false,uf:''};try{localStorage.removeItem('eaieleito')}catch(err){}location.hash='#inicio'}
else if(t.id==='apagar'){document.getElementById('apagarMsg').textContent='Na versão real, isto apaga sua conta e seus dados dos nossos servidores, como prevê a LGPD. Aqui no protótipo, use “Sair deste aparelho”.'}
else if(t.id==='copiar'){const m=document.getElementById('msg').value,o=document.getElementById('copiado');try{navigator.clipboard.writeText(m).then(()=>o.textContent='Mensagem copiada. Cole no e-mail ou na rede social.',()=>o.textContent='Não deu para copiar. Selecione o texto e copie.')}catch(err){o.textContent='Não deu para copiar. Selecione o texto e copie.'}}
else if(t.id==='mail'){t.href=t.href.split('&body=')[0]+'&body='+encodeURIComponent(document.getElementById('msg').value)}});
app.addEventListener('change',e=>{if(e.target.id==='uf'){S.uf=e.target.value;rerender()}if(e.target.id==='cargoE'){S.cargoE=e.target.value;S.cmp=null;render()}});
app.addEventListener('input',e=>{if(e.target.classList.contains('buscaC')){S.buscaC=e.target.value;const pos=e.target.selectionStart,id=e.target.id;render();const b=document.getElementById(id);b.focus();b.setSelectionRange(pos,pos);return}if(e.target.id==='busca'){S.busca=e.target.value;const pos=e.target.selectionStart;render();const b=document.getElementById('busca');b.focus();b.setSelectionRange(pos,pos)}});
app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='fEntrar'){const v=document.getElementById('emE').value.trim();document.getElementById('msgE').textContent=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?`Se ${v} estiver cadastrado, o link chega em instantes. No protótipo, nenhum e-mail é enviado.`:'Confira o e-mail: parece que falta algo.';return}const emI=document.getElementById('em'),em=emI.value.trim(),lg=document.getElementById('lgpd').checked,er=document.getElementById('erro');
emI.removeAttribute('aria-invalid');er.textContent='';
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){emI.setAttribute('aria-invalid','true');er.textContent='Confira o e-mail: parece que falta algo.';emI.focus();return}
if(!lg){er.textContent='Para receber o resumo, marque a concordância com o uso dos dados.';return}
S.email=em;S.nome=document.getElementById('nome').value.trim();S.ok=true;S.passo=4;rerender();scrollTo(0,0)});
addEventListener('hashchange',()=>{if(location.hash==='#cadastro'&&S.passo===4)S.passo=1;S.filtroP='todas';S.picker=null;render();const c=S.irCobrar&&document.getElementById('cobrar');S.irCobrar=false;if(c)c.scrollIntoView();else scrollTo(0,0)});
render();
}
</script>
</body>
</html>
